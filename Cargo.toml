[package]
name = "namazu"
version = "1.0.0"
authors = ["Nathan Fiedler <nathanfiedler@fastmail.fm>"]
edition = "2024"
description = "Simple blob server for tanuki project."
repository = "https://github.com/nlfiedler/namazu"
readme = "README.md"
license = "MIT"

[workspace]
exclude = ["healthcheck"]

[dependencies]
actix-files = "0.6.9"
actix-multipart = "0.7.2"
actix-web = "4.12.1"
anyhow = "1.0.100"
base64 = "0.22.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
futures = "0.3.31"
image = "0.25.9"
kamadak-exif = "0.6.1"
log = "0.4.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tract-onnx = "0.21"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
blake3 = "1.8.4"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
